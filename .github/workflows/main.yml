name: CI

env:
  RELEASE: 5.0.0.43

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Export theme PNGs
        env:
          # Inkscape 1.4.4; Ubuntu apt is still 1.2.2.
          INKSCAPE_APPIMAGE_URL: https://media.inkscape.org/media/resources/file/Inkscape-1.4.4.AppImage
          INKSCAPE_APPIMAGE_SHA256: d217fe05c92faaed5c3af46856b6299c98933dc722819cb5bc2ca052c5522166
        run: |
          curl -fsSL -o inkscape.AppImage "$INKSCAPE_APPIMAGE_URL"
          echo "$INKSCAPE_APPIMAGE_SHA256  inkscape.AppImage" | sha256sum -c -
          chmod +x inkscape.AppImage
          ./inkscape.AppImage --appimage-extract
          export PATH="$PWD/squashfs-root/usr/bin:$PATH"
          inkscape --version
          cd theme && ./themepack-helper.sh

      - name: Prepare
        run: mkdir -p RPMS

      - name: Build aarch64
        uses: coderus/github-sfos-build@sfos5
        with:
          release: ${{ env.RELEASE }}
          arch: aarch64

      - name: Build armv7hl
        uses: coderus/github-sfos-build@sfos5
        with:
          release: ${{ env.RELEASE }}
          arch: armv7hl

      - name: Build i486
        uses: coderus/github-sfos-build@sfos5
        with:
          release: ${{ env.RELEASE }}
          arch: i486

      - name: Upload build results
        uses: actions/upload-artifact@v4
        with:
          name: RPM-build-results_SFOS${{ env.RELEASE }}+
          path: RPMS/

      - name: Upload RPMs to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: RPMS/*.rpm
